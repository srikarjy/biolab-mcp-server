[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biolab-mcp"
version = "0.2.0"
description = "MCP server for auditable biological database queries — every retrieval logged with full context"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Srikar Jy", email = "srikarjy@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.1",
    "defusedxml>=0.7.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.6",
    "mypy>=1.11",
]
server = [
    "mcp[cli]>=1.28",
]

[project.entry-points]
console_scripts = { biolab = "biolab.cli:app" }

[project.urls]
Homepage = "https://github.com/srikarjy/biolab-mcp"
Repository = "https://github.com/srikarjy/biolab-mcp"
Issues = "https://github.com/srikarjy/biolab-mcp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["biolab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "PL", "TRY", "SIM", "T20"]
ignore = ["E501", "TRY003", "PTH123"]
src = ["biolab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.uv]
dev-dependencies = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.6",
    "mypy>=1.11",
]